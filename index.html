<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111;
  --surface2: #181818;
  --surface3: #222;
  --border: #2a2a2a;
  --accent: #E03030;
  --accent-dim: rgba(224,48,48,0.12);
  --text: #e8e8e8;
  --text-dim: #888;
  --text-muted: #444;
  --green: #2ecc71;
  --green-dim: rgba(46,204,113,0.1);
  --yellow: #f39c12;
  --yellow-dim: rgba(243,156,18,0.1);
  --blue: #3498db;
  --blue-dim: rgba(52,152,219,0.1);
  --sidebar-w: 260px;
  --header-h: 52px;
  --radius: 6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input,textarea,select{font-family:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
a{color:var(--accent);text-decoration:none}

/* ── SIDEBAR ── */
#sb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:199;opacity:0;pointer-events:none;transition:opacity .25s}
body.sb-open #sb-overlay{opacity:1;pointer-events:auto}
@media(min-width:769px){#sb-overlay{display:none!important}}
#sidebar{position:fixed;left:0;top:0;height:100vh;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);z-index:200;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
body.sb-open #sidebar{transform:translateX(0)}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:var(--header-h);border-bottom:1px solid var(--border);flex-shrink:0}
.sb-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--accent)}
.sb-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-dim);font-size:18px;transition:background .15s}
.sb-close:hover{background:var(--surface3);color:var(--text)}
.sb-body{flex:1;overflow-y:auto;padding:16px 0}
.sb-section{padding:0 16px 16px}
.sb-section+.sb-section{border-top:1px solid var(--border);padding-top:16px}
.sb-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.sb-label span{color:var(--text-dim);font-size:10px}
.focus-note{font-size:12px;color:var(--text-dim);font-style:italic;margin-bottom:10px;line-height:1.5;border-left:2px solid var(--accent);padding-left:8px}
.focus-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #1a1a1a}
.focus-item:last-child{border-bottom:none}
.focus-cb{width:16px;height:16px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.focus-cb.checked{background:var(--green);border-color:var(--green)}
.focus-cb.checked::after{content:'✓';font-size:10px;color:#000;font-weight:700}
.focus-item-text{flex:1;font-size:13px;line-height:1.4;cursor:pointer}
.focus-item-text:hover{color:var(--accent)}
.focus-item.done .focus-item-text{text-decoration:line-through;color:var(--text-muted)}
.focus-proj{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.sb-see-all{width:100%;margin-top:10px;padding:7px;border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;transition:all .15s}
.sb-see-all:hover{border-color:var(--accent);color:var(--accent)}
.proj-nav-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);cursor:pointer;transition:background .15s;margin-bottom:2px}
.proj-nav-item:hover{background:var(--surface2)}
.proj-nav-item.active{background:var(--accent-dim)}
.proj-nav-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.proj-nav-name{font-size:13px;font-weight:500;flex:1}
.proj-nav-pct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)}
.sb-foot{padding:16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.btn-add-task{padding:10px;background:var(--accent);color:#fff;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;text-align:center;transition:background .15s}
.btn-add-task:hover{background:#ff4040}
.btn-jarvis{padding:8px;border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;text-align:center;transition:all .15s}
.btn-jarvis:hover{border-color:var(--blue);color:var(--blue)}
.btn-settings{padding:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text-muted);text-align:center;text-transform:uppercase;transition:color .15s}
.btn-settings:hover{color:var(--text-dim)}

/* ── MAIN ── */
#main{min-height:100vh;display:flex;flex-direction:column;transition:margin-left .25s cubic-bezier(.4,0,.2,1)}
@media(min-width:769px){body.sb-open #main{margin-left:var(--sidebar-w)}}

/* ── HEADER ── */
#app-header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:50;flex-shrink:0}
#hamburger{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-dim);flex-shrink:0;transition:background .15s}
#hamburger:hover{background:var(--surface2);color:var(--text)}
.h-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--text);white-space:nowrap}
.h-title span{color:var(--accent)}
#view-tabs{display:flex;gap:2px;background:var(--surface2);border-radius:var(--radius);padding:3px;flex-shrink:0}
.view-tab{padding:5px 12px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;transition:all .15s}
.view-tab.active{background:var(--surface3);color:var(--text)}
.view-tab:hover:not(.active){color:var(--text)}
.h-spacer{flex:1}
#last-synced{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);white-space:nowrap}
#save-indicator{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--yellow);display:none;white-space:nowrap}

/* ── VIEW CONTAINER ── */
#view-container{flex:1;padding:20px}
.view{display:none}
.view.active{display:block}

/* ── BACK BUTTON ── */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-bottom:20px;transition:all .15s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── PROJECT GRID ── */
.grid-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.grid-title{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;color:var(--text-muted)}
.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1024px){.project-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.project-grid{grid-template-columns:1fr}}
.proj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .2s,transform .15s;display:flex;flex-direction:column}
.proj-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.proj-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.proj-card-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;line-height:1.1}
.status-pill{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:3px;text-transform:uppercase;flex-shrink:0}
.status-pill.active{background:var(--green-dim);color:var(--green)}
.status-pill.paused{background:var(--yellow-dim);color:var(--yellow)}
.status-pill.done{background:var(--blue-dim);color:var(--blue)}
.proj-progress{margin-bottom:14px}
.prog-label{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-bottom:5px}
.prog-bar{height:3px;background:var(--surface3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.proj-deadline{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);margin-bottom:14px}
.proj-phases{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.phase-row{display:flex;align-items:center;gap:8px}
.phase-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.phase-name{font-size:12px;color:#bbb;flex:1}
.phase-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim)}
.proj-next-action{background:var(--surface2);border-radius:4px;padding:8px 10px}
.pna-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px}
.pna-text{font-size:12px;color:var(--text-dim);line-height:1.4}
.proj-open-btn{width:100%;margin-top:12px;padding:8px;border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;transition:all .15s}
.proj-open-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── PROJECT DETAIL ── */
.proj-detail-header{margin-bottom:24px}
.pdh-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pdh-name{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px}
.pdh-meta{display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)}
.phase-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.phase-block-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;transition:background .15s}
.phase-block-header:hover{background:var(--surface2)}
.phase-block-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;outline:none;border-radius:3px;padding:1px 4px;margin:-1px -4px}
.phase-block-title[contenteditable="true"]{background:var(--surface3);border:1px solid var(--accent);color:var(--text);cursor:text}
.phase-block-title:not([contenteditable="true"]):hover{background:var(--surface2)}
.phase-block-meta{display:flex;align-items:center;gap:8px}
.phase-progress{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)}
.phase-chevron{color:var(--text-muted);transition:transform .2s;font-size:12px}
.phase-block.collapsed .phase-chevron{transform:rotate(-90deg)}
.phase-block.collapsed .phase-tasks{display:none}
.phase-tasks{border-top:1px solid var(--border);padding:8px}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:4px;cursor:pointer;transition:background .15s}
.task-row:hover{background:var(--surface2)}
.task-status-btn{width:18px;height:18px;border-radius:3px;border:1.5px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;transition:all .15s;cursor:pointer}
.task-status-btn.todo{border-color:var(--text-muted);color:transparent}
.task-status-btn.doing{border-color:var(--yellow);background:var(--yellow-dim);color:var(--yellow)}
.task-status-btn.done{border-color:var(--green);background:var(--green);color:#000}
.task-status-btn.blocked{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.task-body{flex:1;min-width:0}
.task-title{font-size:13px;line-height:1.4;margin-bottom:3px}
.task-title.done-text{text-decoration:line-through;color:var(--text-muted)}
.task-meta-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task-dl{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px}
.task-dl.ok{background:var(--green-dim);color:var(--green)}
.task-dl.warn{background:var(--yellow-dim);color:var(--yellow)}
.task-dl.urgent{background:var(--accent-dim);color:var(--accent)}
.task-dl.overdue{background:rgba(180,0,0,.15);color:#ff6b6b}
.task-blocked-tag{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 5px;border-radius:3px;background:var(--accent-dim);color:var(--accent);letter-spacing:.5px}
.task-priority{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 5px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase}
.prio-high{background:rgba(224,48,48,.15);color:var(--accent)}
.prio-medium{background:var(--yellow-dim);color:var(--yellow)}
.prio-low{background:var(--blue-dim);color:var(--blue)}
.phase-add-task{display:flex;align-items:center;gap:6px;padding:6px 8px;margin:4px 0 2px;border-radius:4px;font-size:12px;color:var(--text-muted);transition:all .15s;cursor:pointer}
.phase-add-task:hover{background:var(--surface2);color:var(--text)}
.phase-del-btn{opacity:0;font-size:11px;color:var(--text-muted);padding:2px 5px;border-radius:3px;transition:all .15s}
.phase-block-header:hover .phase-del-btn{opacity:1}
.phase-del-btn:hover{background:var(--accent-dim);color:var(--accent)}
.vel-section{margin:0}
.vel-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}
.vel-bars{display:flex;align-items:flex-end;gap:4px;height:60px}
.vel-bar{flex:1;background:var(--surface3);border-radius:2px 2px 0 0;min-height:3px;transition:background .15s}
.vel-bar:hover{background:var(--accent)}
.vel-day-labels{display:flex;gap:4px;margin-top:4px}
.vel-day-label{flex:1;font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text-muted);text-align:center}
.proj-bottom-row{display:flex;gap:16px;margin-top:24px;align-items:stretch}
.proj-bottom-row .jarvis-chat-section{flex:3;margin-top:0}
.proj-velocity-panel{flex:2;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column}
@media(max-width:700px){.proj-bottom-row{flex-direction:column}}
.proj-card-actions{display:flex;gap:6px;margin-top:auto;padding-top:12px}
.proj-ask-btn{flex:1;padding:7px;border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--blue);text-transform:uppercase;border-color:var(--blue-dim);background:var(--blue-dim);transition:all .15s}
.proj-ask-btn:hover{border-color:var(--blue);background:rgba(52,152,219,.15)}

/* ── WEEK VIEW ── */
.week-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.week-nav-btn{min-width:32px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:all .15s;font-size:13px;white-space:nowrap}
.week-nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.week-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;flex:1}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week-day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;min-height:100px}
.week-day.today{border-color:var(--accent)}
.wd-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px}
.wd-date{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text-dim);margin-bottom:8px}
.week-day.today .wd-date{color:var(--accent)}
.wd-tasks{display:flex;flex-direction:column;gap:4px}
.wd-task{font-size:11px;padding:3px 6px;border-radius:3px;background:var(--surface2);border-left:2px solid var(--accent);line-height:1.3;cursor:pointer;transition:background .15s}
.wd-task:hover{background:var(--surface3)}
.wd-task.done-task{opacity:.4;text-decoration:line-through}
@media(max-width:700px){.week-grid{display:flex;overflow-x:auto;gap:6px;padding-bottom:8px}.week-day{min-width:90px;flex-shrink:0}}

/* ── MONTH VIEW ── */
.month-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.month-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;flex:1}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.month-dow{background:var(--surface);padding:8px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-muted);text-align:center;text-transform:uppercase}
.month-cell{background:var(--surface);padding:6px;min-height:70px}
.month-cell.today{background:var(--accent-dim)}
.month-cell.other-month{opacity:.3}
.mc-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:4px}
.month-cell.today .mc-date{color:var(--accent);font-weight:700}
.mc-events{display:flex;flex-direction:column;gap:2px}
.mc-event{font-size:10px;padding:1px 4px;border-radius:2px;background:var(--yellow-dim);color:var(--yellow);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
@media(max-width:600px){.month-cell{min-height:50px;padding:4px}.mc-date{font-size:10px}}

/* ── TABLE VIEW ── */
.table-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
.task-table{width:100%;border-collapse:collapse;min-width:580px}
.task-table th{padding:10px 12px;text-align:left;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap;user-select:none}
.task-table th:hover{color:var(--text)}
.task-table th.sorted{color:var(--accent)}
.task-table td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.task-table tr:last-child td{border-bottom:none}
.task-table tbody tr{cursor:pointer;transition:background .15s}
.task-table tbody tr:hover{background:var(--surface2)}
.table-filter-row td{padding:5px 8px;border-bottom:1px solid var(--border);background:var(--surface)}
.table-filter-row input,.table-filter-row select{font-size:11px;padding:4px 8px}

/* ── TASK DRAWER ── */
#task-drawer{position:fixed;inset:0;z-index:300;pointer-events:none}
#task-drawer.open{pointer-events:auto}
.drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
#task-drawer.open .drawer-backdrop{opacity:1}
.drawer-panel{position:absolute;right:0;top:0;height:100%;width:420px;max-width:100%;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
#task-drawer.open .drawer-panel{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-dim);font-size:18px;transition:background .15s}
.drawer-back:hover{background:var(--surface2);color:var(--text)}
.drawer-head-title{flex:1;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-del{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-muted);font-size:14px;transition:all .15s}
.drawer-del:hover{background:var(--accent-dim);color:var(--accent)}
.drawer-body{flex:1;overflow-y:auto;padding:16px}
.drawer-field{margin-bottom:16px}
.drawer-field-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.status-btns{display:flex;gap:6px;flex-wrap:wrap}
.status-opt{padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);transition:all .15s}
.status-opt.active-todo{border-color:var(--text);color:var(--text)}
.status-opt.active-doing{border-color:var(--yellow);color:var(--yellow);background:var(--yellow-dim)}
.status-opt.active-done{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.status-opt.active-blocked{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.blocked-toggle{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s}
.blocked-toggle.on{border-color:var(--accent);background:var(--accent-dim)}
.blocked-toggle-dot{width:12px;height:12px;border-radius:50%;background:var(--border);transition:background .15s;flex-shrink:0}
.blocked-toggle.on .blocked-toggle-dot{background:var(--accent)}
.blocked-toggle-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim)}
.blocked-toggle.on .blocked-toggle-label{color:var(--accent)}
.attachments-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.attach-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border-radius:var(--radius)}
.attach-icon{font-size:13px;flex-shrink:0}
.attach-name{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-del{color:var(--text-muted);font-size:14px;transition:color .15s}
.attach-del:hover{color:var(--accent)}
.attach-btns{display:flex;gap:6px}
.attach-btn{padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;transition:all .15s}
.attach-btn:hover{border-color:var(--blue);color:var(--blue)}
.drawer-timestamps{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);line-height:1.8}
.drawer-save{width:100%;margin-top:4px;padding:10px;background:var(--accent);color:#fff;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;transition:background .15s}
.drawer-save:hover{background:#ff4040}
.drawer-focus-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border-radius:var(--radius);margin-bottom:16px}
.drawer-focus-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase}
.toggle-switch{width:36px;height:20px;border-radius:10px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-switch.on{background:var(--accent)}
.toggle-switch::after{content:'';width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s}
.toggle-switch.on::after{left:19px}

/* ── MODALS ── */
.modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.modal-box{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-box.wide{max-width:600px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px}
.modal-close{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-dim);font-size:18px;transition:background .15s}
.modal-close:hover{background:var(--surface2);color:var(--text)}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.form-row{margin-bottom:14px}
.form-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;display:block}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn-primary{padding:9px 20px;background:var(--accent);color:#fff;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;transition:background .15s}
.btn-primary:hover{background:#ff4040}
.btn-secondary{padding:9px 16px;border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;transition:all .15s}
.btn-secondary:hover{border-color:var(--text-dim);color:var(--text)}
.focus-all-task{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;transition:background .15s}
.focus-all-task:hover{background:var(--surface2)}
.focus-all-task-title{font-size:13px;flex:1}
.focus-all-proj{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-top:2px}
.focus-section-head{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;color:var(--text);z-index:500;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{border-color:var(--green);color:var(--green)}
#toast.error{border-color:var(--accent);color:var(--accent)}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:600;flex-direction:column;gap:16px}
.load-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;color:var(--accent)}
.load-bar{width:120px;height:2px;background:var(--surface2);border-radius:1px;overflow:hidden}
.load-fill{height:100%;background:var(--accent);border-radius:1px;animation:loadpulse 1.2s ease-in-out infinite alternate}
@keyframes loadpulse{from{width:0}to{width:100%}}

/* ── AUTH GATE ── */
#auth-gate{position:fixed;inset:0;background:var(--bg);z-index:700;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px 48px;display:flex;flex-direction:column;align-items:center;gap:20px;width:320px}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:4px;color:var(--accent);margin-bottom:4px}
.auth-sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-top:-12px;margin-bottom:8px}
.auth-input{width:100%;text-align:center;letter-spacing:3px;font-size:16px;padding:12px}
.auth-btn{width:100%;padding:11px;background:var(--accent);color:#fff;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;transition:background .15s}
.auth-btn:hover{background:#ff4040}
.auth-err{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:1px;display:none}

/* ── JARVIS CHAT ── */
.jarvis-chat-section{padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column}
.jarvis-chat-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.jarvis-chat-section textarea{resize:none;background:var(--surface2);flex:1}
.jarvis-send-btn{padding:8px 16px;background:var(--blue-dim);border:1px solid var(--blue-dim);color:var(--blue);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;transition:all .15s}
.jarvis-send-btn:hover{background:rgba(52,152,219,.2);border-color:var(--blue)}

/* ── MOBILE ── */
@media(max-width:600px){
  #view-container{padding:12px}
  .view-tab{padding:5px 8px;font-size:9px;letter-spacing:.5px}
  .h-title{font-size:17px}
  #last-synced{display:none}
  .proj-card{padding:14px}
  .proj-card-name{font-size:18px}
  .pdh-name{font-size:26px}
  .pdh-meta{flex-wrap:wrap;gap:8px}
  .meta-grid{grid-template-columns:1fr}
  .form-row-2{grid-template-columns:1fr}
  .drawer-panel{width:100%;border-left:none;border-top:1px solid var(--border);height:92%;top:auto;bottom:0;border-radius:12px 12px 0 0;transform:translateY(100%)}
  #task-drawer.open .drawer-panel{transform:translateY(0)}
}
</style>
</head>
<body>

<div id="auth-gate">
  <div class="auth-box">
    <div class="auth-logo">CHRONICLE</div>
    <div class="auth-sub">Personal Dashboard</div>
    <input class="auth-input" id="auth-input" type="password" placeholder="••••••••" autocomplete="current-password">

<div id="toast"></div>

<script>
const GH = { owner:'rayyanali722-cmyk', repo:'chronicle', branch:'main', file:'data.json' };
const AUTH_KEY = 'chronicle_auth';
const PASS = 'chronicle2026'; // change this to your preferred password
const PROXY_URL = 'https://chronicle-proxy.rayyan-chronicle.workers.dev';

function checkAuth(){ return sessionStorage.getItem(AUTH_KEY)==='1'; }
function submitAuth(){
  const val=document.getElementById('auth-input').value;
  const err=document.getElementById('auth-err');
  if(val===PASS){
    sessionStorage.setItem(AUTH_KEY,'1');
    document.getElementById('auth-gate').style.display='none';
    document.getElementById('loading').style.display='flex';
    initApp();
  } else {
    err.style.display='block';
    document.getElementById('auth-input').value='';
    document.getElementById('auth-input').focus();
    setTimeout(()=>err.style.display='none',2000);
  }
}

const APP = {
  data: null, view:'grid', project:null,
  weekOffset:0, monthOffset:0,
  tableSort:{col:'deadline',dir:'asc'},
  tableFilters:{project:'',status:'',priority:'',deadline:'',title:''},
  drawerTaskId:null, drawerState:null,
  saving:false, lastLoaded:null
};

// PAT moved server-side — no longer stored in browser (Priority 3: security proxy)

// ── DATA ──
async function loadData(force){
  try{
    // Read through proxy if configured — avoids GitHub Pages CDN cache delay
    let res;
    if(PROXY_URL && !PROXY_URL.startsWith('REPLACE')){
      res=await fetch(
        `${PROXY_URL}/github/repos/${GH.owner}/${GH.repo}/contents/${GH.file}`,
        {headers:{'X-Chronicle-Auth':PASS}}
      );
      if(!res.ok) throw new Error();
      const ghData=await res.json();
      // GitHub Contents API returns base64-encoded content
      APP.data=JSON.parse(decodeURIComponent(escape(atob(ghData.content.replace(/\n/g,'')))));
    } else {
      res=await fetch(`./data.json?t=${Date.now()}`);
      if(!res.ok) throw new Error();
      APP.data=await res.json();
    }
    APP.lastLoaded=new Date();
  }catch(e){
    if(!APP.data) APP.data=getDefaultData();
    if(force) showToast('Could not reach GitHub','error');
  }
  render();
  if(force){ closeSettingsModal(); showToast('Reloaded ✓','success'); }
}

async function saveData(){
  if(!PROXY_URL||PROXY_URL.startsWith('REPLACE')){
    showToast('Proxy not configured — see CHRONICLE_LOG.md Priority 3','error');
    return false;
  }
  APP.saving=true;
  document.getElementById('save-indicator').style.display='inline';
  APP.data.meta.lastUpdated=new Date().toISOString();
  const proxyHeaders={'Content-Type':'application/json','X-Chronicle-Auth':PASS};
  try{
    const shaRes=await fetch(
      `${PROXY_URL}/github/repos/${GH.owner}/${GH.repo}/contents/${GH.file}`,
      {headers:proxyHeaders}
    );
    if(!shaRes.ok) throw new Error(`SHA fetch failed: ${shaRes.status}`);
    const shaData=await shaRes.json();
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(APP.data,null,2))));
    const putRes=await fetch(
      `${PROXY_URL}/github/repos/${GH.owner}/${GH.repo}/contents/${GH.file}`,
      {
        method:'PUT',
        headers:proxyHeaders,
        body:JSON.stringify({message:'Update data.json via Chronicle',content,sha:shaData.sha,branch:GH.branch})
      }
    );
    if(!putRes.ok) throw new Error(`PUT failed: ${putRes.status}`);
    APP.lastLoaded=new Date();
    showToast('Saved ✓','success');
    return true;
  }catch(e){
    showToast('Save failed — check proxy or network','error');
    console.error('saveData error:',e);
    return false;
  }finally{
    APP.saving=false;
    document.getElementById('save-indicator').style.display='none';
  }
}

// ── RENDER ──
function render(){ renderSidebar(); renderActiveView(); renderLastSynced(); document.getElementById('loading').style.display='none'; }

function renderLastSynced(){
  const el=document.getElementById('last-synced');
  const ts=APP.data?.meta?.lastUpdated;
  el.textContent=ts?'SYNCED '+timeAgo(ts):'';
}

function renderSidebar(){ if(!APP.data) return; renderFocus(); renderProjectsNav(); }

function renderFocus(){
  const d=APP.data;
  const today=todayISO();
  document.getElementById('focus-date-label').textContent=formatDateShort(today);
  const note=d.focus?.note;
  document.getElementById('focus-note-el').innerHTML=note?`<div class="focus-note">${escHtml(note)}</div>`:'';
  const ids=(d.focus?.taskIds)||[];
  const tasks=ids.map(id=>getTaskById(id)).filter(Boolean);
  const SHOW=5;
  const shown=tasks.slice(0,SHOW);
  const fl=document.getElementById('focus-list');
  fl.innerHTML='';
  if(!tasks.length){
    fl.innerHTML='<div style="font-size:12px;color:var(--text-muted);padding:4px 0">No focus set — ask Jarvis.</div>';
  }else{
    shown.forEach(t=>{
      const proj=getProjectById(t.project);
      const done=t.status==='done';
      const div=document.createElement('div');
      div.className='focus-item'+(done?' done':'');
      div.innerHTML=`<div class="focus-cb${done?' checked':''}" onclick="checkFocusTask('${t.id}');event.stopPropagation()"></div>
        <div style="flex:1;min-width:0">
          <div class="focus-item-text" onclick="openTaskDrawer('${t.id}')">${escHtml(t.title)}</div>
          <div class="focus-proj">${proj?escHtml(proj.name):''}</div>
        </div>`;
      fl.appendChild(div);
    });
  }
  const btn=document.getElementById('sb-see-all-btn');
  btn.style.display='block';
  btn.textContent=tasks.length>SHOW?`SEE ALL ${tasks.length} TASKS →`:'MANAGE FOCUS →';
}

function renderProjectsNav(){
  const nav=document.getElementById('projects-nav');
  nav.innerHTML='';
  Object.values(APP.data.projects||{}).forEach(p=>{
    const pct=calcProgress(p.id);
    const el=document.createElement('div');
    el.className='proj-nav-item'+(APP.project===p.id?' active':'');
    el.onclick=()=>{ openProject(p.id); if(window.innerWidth<=768) toggleSidebar(); };
    el.innerHTML=`<div class="proj-nav-dot"></div><span class="proj-nav-name">${escHtml(p.name)}</span><span class="proj-nav-pct">${pct}%</span>`;
    nav.appendChild(el);
  });
}

function renderActiveView(){ if(!APP.data) return; switch(APP.view){ case'grid':renderGrid();break;case'week':renderWeek();break;case'month':renderMonth();break;case'table':renderTable();break; } }

// ── GRID ──
function renderGrid(){
  const el=document.getElementById('view-grid');
  if(!APP.data){el.innerHTML='';return;}
  if(APP.project){ renderProject(APP.project,el); return; }
  const projects=Object.values(APP.data.projects||{});
  let html=`<div class="grid-header"><span class="grid-title">ALL PROJECTS — ${projects.length} ACTIVE</span><button onclick="openAddTaskModal(null,null)" style="padding:6px 14px;background:var(--accent);color:#fff;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px">+ TASK</button></div><div class="project-grid">`;
  projects.forEach(p=>{
    const pct=calcProgress(p.id);
    const tasks=getProjectTasks(p.id);
    const next=tasks.find(t=>t.status!=='done'&&!t.blocked)||tasks.find(t=>t.status!=='done')||null;
    const phases=(p.phases||[]).map(ph=>{
      const pt=ph.taskIds.map(id=>getTaskById(id)).filter(Boolean);
      const done=pt.filter(t=>t.status==='done').length;
      const col=done===pt.length&&pt.length>0?'var(--green)':done>0?'var(--yellow)':'var(--border)';
      return `<div class="phase-row"><div class="phase-dot" style="background:${col}"></div><span class="phase-name">${escHtml(ph.name)}</span><span class="phase-count">${done}/${pt.length}</span></div>`;
    }).join('');
    const dl=p.deadline?`${daysUntil(p.deadline)}d left · ${formatDate(p.deadline)}`:'No deadline';
    html+=`<div class="proj-card" onclick="openProject('${p.id}')">
      <div class="proj-card-top"><span class="proj-card-name">${escHtml(p.name)}</span><span class="status-pill ${p.status}">${p.status}</span></div>
      <div class="proj-progress"><div class="prog-label"><span>PROGRESS</span><span>${pct}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>
      <div class="proj-deadline">${escHtml(dl)}</div>
      <div class="proj-phases">${phases}</div>
      ${next?`<div class="proj-next-action"><div class="pna-label">Next Action</div><div class="pna-text">${escHtml(next.title)}</div></div>`:''}
      <div class="proj-card-actions">
        <button class="proj-ask-btn" onclick="event.stopPropagation();copyProjectContext('${p.id}')">⚡ ASK JARVIS</button>
        <button class="proj-open-btn" style="flex:2;margin-top:0" onclick="event.stopPropagation();openProject('${p.id}')">OPEN →</button>
      </div>
    </div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

function renderProject(pid,container){
  const p=getProjectById(pid);
  if(!p){APP.project=null;renderGrid();return;}
  const pct=calcProgress(pid);
  const tasks=getProjectTasks(pid);
  const done=tasks.filter(t=>t.status==='done').length;
  let html=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <button class="back-btn" style="margin-bottom:0" onclick="backToGrid()">← ALL PROJECTS</button>
      <div style="flex:1"></div>
      <button onclick="copyProjectContext('${pid}')" style="padding:6px 12px;border:1px solid var(--blue-dim);background:var(--blue-dim);color:var(--blue);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;transition:all .15s" onmouseover="this.style.borderColor='var(--blue)'" onmouseout="this.style.borderColor='var(--blue-dim)'">⚡ ASK JARVIS</button>
      <button onclick="deleteProject('${pid}')" style="padding:6px 12px;border:1px solid var(--border);color:var(--text-muted);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;transition:all .15s" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-muted)'">🗑 DELETE PROJECT</button>
    </div>
    <div class="proj-detail-header">
      <div class="pdh-top"><span class="pdh-name">${escHtml(p.name)}</span><span class="status-pill ${p.status}">${p.status}</span></div>
      <div class="pdh-meta"><span>${pct}% complete</span><span>·</span><span>${done}/${tasks.length} tasks done</span>${p.deadline?`<span>·</span><span>Due ${formatDate(p.deadline)}</span>`:''}</div>
    </div>`;
  (p.phases||[]).forEach(ph=>{
    const pt=ph.taskIds.map(id=>getTaskById(id)).filter(Boolean);
    const d=pt.filter(t=>t.status==='done').length;
    html+=`<div class="phase-block" id="ph-${ph.id}">
      <div class="phase-block-header" onclick="togglePhase('${ph.id}')">
        <span class="phase-block-title" ondblclick="event.stopPropagation();renamePhase('${pid}','${ph.id}')" title="Double-click to rename">${escHtml(ph.name)}</span>
        <div class="phase-block-meta">
          <span class="phase-progress">${d}/${pt.length}</span>
          <button class="phase-del-btn" onclick="event.stopPropagation();deletePhase('${pid}','${ph.id}')" title="Delete phase">✕</button>
          <span class="phase-chevron">▾</span>
        </div>
      </div>
      <div class="phase-tasks">
        ${pt.map(t=>renderTaskRow(t)).join('')}
        <div class="phase-add-task" onclick="openAddTaskModal('${pid}','${ph.id}')">+ Add task to this phase</div>
      </div>
    </div>`;
  });
  // Safety net: show tasks that belong to this project but aren't in any phase's taskIds
  const allPhaseTaskIds=new Set((p.phases||[]).flatMap(ph=>ph.taskIds));
  const orphans=Object.values(APP.data.tasks||{}).filter(t=>t.project===pid&&!allPhaseTaskIds.has(t.id));
  if(orphans.length){
    const od=orphans.filter(t=>t.status==='done').length;
    html+=`<div class="phase-block" id="ph-orphan-${pid}">
      <div class="phase-block-header" onclick="this.closest('.phase-block').classList.toggle('collapsed')">
        <span class="phase-block-title" style="color:var(--text-muted)">UNCATEGORIZED</span>
        <div class="phase-block-meta"><span class="phase-progress">${od}/${orphans.length}</span><span class="phase-chevron">▾</span></div>
      </div>
      <div class="phase-tasks">${orphans.map(t=>renderTaskRow(t)).join('')}</div>
    </div>`;
  }
  html+=`<button onclick="addPhase('${pid}')" style="margin-top:4px;padding:8px 14px;border:1px dashed var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;width:100%;transition:all .15s" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-muted)'">+ ADD PHASE</button>
  <div class="proj-bottom-row">
    <div class="jarvis-chat-section">
      <div class="jarvis-chat-label">⚡ Ask Jarvis About This Project</div>

        <button class="jarvis-send-btn" onclick="sendToJarvis('${pid}')">⚡ COPY FOR JARVIS</button>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px;font-family:'JetBrains Mono',monospace">Copies full context + your question → paste into Jarvis on Claude.ai</div>
    </div>
    <div class="proj-velocity-panel">
      <div class="vel-label">7-DAY VELOCITY</div>
      ${velocityChart(pid, true)}

  </div>`;
  container.innerHTML=html;
}

function renderTaskRow(t){
  const dlClass=t.deadline?deadlineClass(t.deadline):'';
  const icons={todo:'',doing:'▶',done:'✓',blocked:'!'};
  return `<div class="task-row" onclick="openTaskDrawer('${t.id}')">
    <div class="task-status-btn ${t.status}" onclick="event.stopPropagation();cycleStatus('${t.id}')">${icons[t.status]||''}</div>
    <div class="task-body">
      <div class="task-title${t.status==='done'?' done-text':''}">${escHtml(t.title)}</div>
      <div class="task-meta-row">
        ${t.deadline?`<span class="task-dl ${dlClass}">${formatDate(t.deadline)}</span>`:''}
        ${t.blocked?`<span class="task-blocked-tag">BLOCKED</span>`:''}
        ${t.priority?`<span class="task-priority prio-${t.priority}">${t.priority}</span>`:''}
      </div>
    </div>

// ── WEEK ──
function renderWeek(){
  const el=document.getElementById('view-week');
  const base=new Date(); base.setDate(base.getDate()+APP.weekOffset*7);
  const dow=base.getDay(); const mon=new Date(base); mon.setDate(base.getDate()-(dow===0?6:dow-1));
  const days=[]; for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d);}
  const wStr=`${days[0].toLocaleDateString('en',{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})}`;
  const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const todayStr=todayISO();
  let html=`<div class="week-nav"><button class="week-nav-btn" onclick="APP.weekOffset--;renderWeek()">‹</button><span class="week-label">${wStr}</span><button class="week-nav-btn" onclick="APP.weekOffset=0;renderWeek()">TODAY</button><button class="week-nav-btn" onclick="APP.weekOffset++;renderWeek()">›</button></div><div class="week-grid">`;
  days.forEach((d,i)=>{
    const iso=d.toISOString().split('T')[0];
    const isToday=iso===todayStr;
    const dt=Object.values(APP.data.tasks||{}).filter(t=>t.deadline===iso);
    html+=`<div class="week-day${isToday?' today':''}"><div class="wd-label">${DAYS[i]}</div><div class="wd-date">${d.getDate()}</div><div class="wd-tasks">
      ${dt.slice(0,5).map(t=>`<div class="wd-task${t.status==='done'?' done-task':''}" onclick="openTaskDrawer('${t.id}')">${escHtml(t.title)}</div>`).join('')}
      ${dt.length>5?`<div style="font-size:10px;color:var(--text-muted);padding:2px 4px">+${dt.length-5} more</div>`:''}
    </div></div>`;
  });
  el.innerHTML=html+'</div>';
}

// ── MONTH ──
function renderMonth(){
  const el=document.getElementById('view-month');
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+APP.monthOffset);
  const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const todayStr=todayISO();
  let sd=first.getDay(); sd=sd===0?6:sd-1;
  const mName=first.toLocaleDateString('en',{month:'long',year:'numeric'}).toUpperCase();
  let html=`<div class="month-nav"><button class="week-nav-btn" onclick="APP.monthOffset--;renderMonth()">‹</button><span class="month-label">${mName}</span><button class="week-nav-btn" onclick="APP.monthOffset=0;renderMonth()">TODAY</button><button class="week-nav-btn" onclick="APP.monthOffset++;renderMonth()">›</button></div>
  <div class="month-grid"><div class="month-dow">MON</div><div class="month-dow">TUE</div><div class="month-dow">WED</div><div class="month-dow">THU</div><div class="month-dow">FRI</div><div class="month-dow">SAT</div><div class="month-dow">SUN</div>`;
  for(let i=0;i<sd;i++) html+=`<div class="month-cell other-month"></div>`;
  for(let day=1;day<=last.getDate();day++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday=iso===todayStr;
    const dt=Object.values(APP.data.tasks||{}).filter(t=>t.deadline===iso);
    html+=`<div class="month-cell${isToday?' today':''}"><div class="mc-date">${day}</div><div class="mc-events">
      ${dt.slice(0,3).map(t=>`<div class="mc-event" onclick="openTaskDrawer('${t.id}')" title="${escHtml(t.title)}">${escHtml(t.title)}</div>`).join('')}
      ${dt.length>3?`<div style="font-size:9px;color:var(--text-muted)">+${dt.length-3}</div>`:''}
    </div></div>`;
  }
  const total=sd+last.getDate(); const trail=(7-total%7)%7;
  for(let i=0;i<trail;i++) html+=`<div class="month-cell other-month"></div>`;
  el.innerHTML=html+`</div>`;
}

// ── TABLE ──
function renderTable(){
  const el=document.getElementById('view-table');
  if(!APP.data){el.innerHTML='';return;}
  let tasks=Object.values(APP.data.tasks||{});
  const f=APP.tableFilters, s=APP.tableSort;
  if(f.project) tasks=tasks.filter(t=>t.project===f.project);
  if(f.status)  tasks=tasks.filter(t=>t.status===f.status);
  if(f.priority)tasks=tasks.filter(t=>t.priority===f.priority);
  if(f.deadline==='overdue') tasks=tasks.filter(t=>t.deadline&&daysUntil(t.deadline)<0&&t.status!=='done');
  else if(f.deadline==='week') tasks=tasks.filter(t=>t.deadline&&daysUntil(t.deadline)<=7&&daysUntil(t.deadline)>=0);
  if(f.title) tasks=tasks.filter(t=>t.title.toLowerCase().includes(f.title.toLowerCase()));
  tasks.sort((a,b)=>{let av=a[s.col]||'9999',bv=b[s.col]||'9999';return s.dir==='asc'?(av<bv?-1:av>bv?1:0):(av>bv?-1:av<bv?1:0);});
  const arr=s.dir==='asc'?'↑':'↓';
  const th=(col,lbl)=>`<th onclick="sortTable('${col}')" class="${s.col===col?'sorted':''}">${lbl}${s.col===col?` ${arr}`:''}</th>`;
  const projs=Object.values(APP.data.projects||{});
  let html=`<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button onclick="openAddTaskModal(null,null)" style="padding:7px 16px;background:var(--accent);color:#fff;border-radius:var(--radius);font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;transition:background .15s" onmouseover="this.style.background='#ff4040'" onmouseout="this.style.background='var(--accent)'">+ ADD TASK</button></div>
  <div class="table-wrap"><table class="task-table"><thead>
    <tr>${th('title','TASK')}${th('project','PROJECT')}${th('status','STATUS')}${th('priority','PRIORITY')}${th('deadline','DEADLINE')}</tr>
    <tr class="table-filter-row">
      <td><input type="text" placeholder="Filter…" value="${escHtml(f.title)}" oninput="APP.tableFilters.title=this.value;renderTable()"></td>
      <td><select onchange="APP.tableFilters.project=this.value;renderTable()"><option value="">All projects</option>${projs.map(p=>`<option value="${p.id}"${f.project===p.id?'selected':''}>${escHtml(p.name)}</option>`).join('')}</select></td>
      <td><select onchange="APP.tableFilters.status=this.value;renderTable()"><option value="">All</option><option value="todo">Todo</option><option value="doing">Doing</option><option value="done">Done</option><option value="blocked">Blocked</option></select></td>
      <td><select onchange="APP.tableFilters.priority=this.value;renderTable()"><option value="">All</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></td>
      <td><select onchange="APP.tableFilters.deadline=this.value;renderTable()"><option value="">All</option><option value="week">This week</option><option value="overdue">Overdue</option></select></td>
    </tr>
    </thead><tbody>`;
  if(!tasks.length){
    html+=`<tr><td colspan="5" style="text-align:center;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:11px;padding:24px">No tasks match filters</td></tr>`;
  }else{
    tasks.forEach(t=>{
      const proj=getProjectById(t.project);
      const dlClass=t.deadline?deadlineClass(t.deadline):'';
      const sCol={todo:'var(--text-dim)',doing:'var(--yellow)',done:'var(--green)',blocked:'var(--accent)'}[t.status]||'var(--text-dim)';
      html+=`<tr onclick="openTaskDrawer('${t.id}')">
        <td>${escHtml(t.title)}</td>
        <td><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim)">${proj?escHtml(proj.name):''}</span></td>
        <td><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${sCol};text-transform:uppercase">${t.status}</span></td>
        <td><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);text-transform:uppercase">${t.priority||''}</span></td>
        <td>${t.deadline?`<span class="task-dl ${dlClass}">${formatDate(t.deadline)}</span>`:'—'}</td>
      </tr>`;
    });
  }
  el.innerHTML=html+`</tbody></table></div>`;
}

function sortTable(col){ APP.tableSort.dir=APP.tableSort.col===col?(APP.tableSort.dir==='asc'?'desc':'asc'):'asc'; APP.tableSort.col=col; renderTable(); }

// ── SIDEBAR / NAV ──
function toggleSidebar(){ document.body.classList.toggle('sb-open'); }
function switchView(v){
  APP.view=v; APP.project=null;
  const views=['grid','week','month','table'];
  document.querySelectorAll('.view-tab').forEach((t,i)=>t.classList.toggle('active',views[i]===v));
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id==='view-'+v));
  renderActiveView(); renderProjectsNav();
}
function openProject(id){ APP.view='grid'; APP.project=id; document.querySelectorAll('.view-tab').forEach((t,i)=>t.classList.toggle('active',i===0)); document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id==='view-grid')); renderGrid(); renderProjectsNav(); }
function backToGrid(){ APP.project=null; renderGrid(); renderProjectsNav(); }
function togglePhase(id){ document.getElementById('ph-'+id)?.classList.toggle('collapsed'); }

// ── FOCUS ACTIONS ──
function checkFocusTask(id){
  const t=getTaskById(id); if(!t) return;
  t.status=t.status==='done'?'todo':'done';
  t.completedAt=t.status==='done'?new Date().toISOString():null;
  renderFocus(); renderProjectsNav(); renderActiveView(); saveData();
}
function cycleStatus(id){
  const t=getTaskById(id); if(!t) return;
  const c={todo:'doing',doing:'done',done:'todo',blocked:'todo'};
  t.status=c[t.status]||'todo'; t.completedAt=t.status==='done'?new Date().toISOString():null;
  renderFocus(); renderProjectsNav(); renderActiveView(); saveData();
}

// ── TASK DRAWER ──
function openTaskDrawer(id){
  const t=getTaskById(id); if(!t) return;
  APP.drawerTaskId=id; APP.drawerState=JSON.parse(JSON.stringify(t));
  document.getElementById('drawer-head-title').textContent=t.title;
  renderDrawerBody();
  document.getElementById('task-drawer').classList.add('open');
}

function renderDrawerBody(){
  const t=APP.drawerState;
  const proj=getProjectById(t.project);
  const projs=Object.values(APP.data.projects||{});
  const phases=proj?(proj.phases||[]):[];
  const inFocus=(APP.data.focus?.taskIds||[]).includes(t.id);
  const icons={todo:'',doing:'▶',done:'✓',blocked:'!'};
  const sopts=['todo','doing','done','blocked'].map(s=>`<button class="status-opt${t.status===s?' active-'+s:''}" onclick="drawerSetStatus('${s}')">${s}</button>`).join('');
  const attHtml=(t.files||[]).map((f,i)=>{
    const icon=f.type==='url'?'🔗':f.type==='file'?'📎':'📝';
    const label=f.type==='url'?`<a href="${escHtml(f.content)}" target="_blank" rel="noopener">${escHtml(f.name)}</a>`:f.type==='file'?`<a href="${f.content}" download="${escHtml(f.name)}">${escHtml(f.name)}</a>`:escHtml(f.name);
    return `<div class="attach-item"><span class="attach-icon">${icon}</span><span class="attach-name">${label}</span><button class="attach-del" onclick="drawerRemoveAttach(${i})">✕</button></div>`;
  }).join('');

  document.getElementById('drawer-body').innerHTML=`
    <div class="drawer-focus-row">
      <span class="drawer-focus-label">In Today's Focus</span>
      <div class="toggle-switch${inFocus?' on':''}" id="focus-toggle" onclick="drawerToggleFocus()"></div>

function drawerSetStatus(s){ APP.drawerState.status=s; APP.drawerState.completedAt=s==='done'?new Date().toISOString():null; renderDrawerBody(); }
function drawerToggleBlocked(){

}
function drawerProjectChange(){
  const pid=document.getElementById('d-project')?.value; APP.drawerState.project=pid;
  const proj=getProjectById(pid); const ph=document.getElementById('d-phase');
  if(ph) ph.innerHTML=(proj?.phases||[]).map(p=>`<option value="${p.id}">${escHtml(p.name)}</option>`).join('');

function drawerToggleFocus(){
  if(!APP.data.focus) APP.data.focus={date:todayISO(),taskIds:[],note:''};
  const ids=APP.data.focus.taskIds; const idx=ids.indexOf(APP.drawerState.id);
  if(idx>-1) ids.splice(idx,1); else ids.push(APP.drawerState.id);
  const tog=document.getElementById('focus-toggle'); if(tog) tog.classList.toggle('on',ids.includes(APP.drawerState.id));

}
function drawerAddAttach(type){
  if(type==='url'){
    let url=prompt('Enter URL:'); if(!url) return;
    url=url.trim();
    if(url && !/^https?:\/\//i.test(url)) url='https://'+url;
    const name=prompt('Label:',url); if(!name) return;
    (APP.drawerState.files=APP.drawerState.files||[]).push({type:'url',name,content:url});
    renderDrawerBody();
  } else if(type==='file'){
    document.getElementById('drawer-file-input').click();
  }
}
function drawerHandleFile(e){
  const file=e.target.files[0]; if(!file) return;
  if(file.size>1024*1024){ showToast('File too large — max 1 MB. Use a link instead.','error'); e.target.value=''; return; }
  const reader=new FileReader();
  reader.onload=()=>{
    (APP.drawerState.files=APP.drawerState.files||[]).push({type:'file',name:file.name,content:reader.result});
    e.target.value='';
    renderDrawerBody();
  };
  reader.readAsDataURL(file);
}
function drawerRemoveAttach(i){ APP.drawerState.files.splice(i,1); renderDrawerBody(); }
function renamePhase(pid,phId){
  const proj=APP.data.projects[pid]; if(!proj) return;
  const ph=(proj.phases||[]).find(p=>p.id===phId); if(!ph) return;
  const el=document.querySelector(`#ph-${phId} .phase-block-title`); if(!el) return;
  const old=ph.name;
  el.contentEditable='true'; el.focus();
  const range=document.createRange(); range.selectNodeContents(el);
  window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
  function commit(){
    el.contentEditable='false';
    const val=el.textContent.trim();
    if(val && val!==old){ ph.name=val; saveData(); renderActiveView(); } else { el.textContent=old; }
    el.removeEventListener('blur',commit); el.removeEventListener('keydown',onKey);
  }
  function onKey(e){
    if(e.key==='Enter'){ e.preventDefault(); commit(); }
    if(e.key==='Escape'){ el.textContent=old; el.contentEditable='false'; el.removeEventListener('blur',commit); el.removeEventListener('keydown',onKey); }
  }
  el.addEventListener('blur',commit); el.addEventListener('keydown',onKey);
}

  const id='task-'+Date.now();
  const task={id,title,project:document.getElementById('at-project').value,phase:document.getElementById('at-phase').value,status:'todo',priority:document.getElementById('at-priority').value,deadline:document.getElementById('at-deadline').value||null,blocked:false,notes:document.getElementById('at-notes').value,files:[],createdAt:new Date().toISOString(),completedAt:null};

  let ph=proj?.phases?.find(p=>p.id===task.phase);
  if(!ph && proj){
    // No matching phase (project has none yet) — auto-create a default "Tasks" phase
    if(!proj.phases) proj.phases=[];

function copyJarvisContext(){
  const d=APP.data; const today=todayISO();

  const blocked=Object.values(d.tasks||{}).filter(t=>t.blocked&&t.status!=='done');

  Object.values(d.projects||{}).forEach(p=>{
    const pct=calcProgress(p.id);
    ctx+=`**${p.name}** — ${pct}% complete${p.deadline?' | Due: '+p.deadline:''}\n`;
    (p.phases||[]).forEach(ph=>{
      const pt=ph.taskIds.map(id=>getTaskById(id)).filter(Boolean);

  ctx+=`\n---\n[Your question here]`;
  navigator.clipboard.writeText(ctx).then(()=>showToast('Jarvis context copied — paste in Claude.ai ✓','success')).catch(()=>showToast('Copy failed','error'));
}

// ── VELOCITY CHART ──
function velocityChart(pid, bare=false){
  const days=[]; for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().split('T')[0]);}
  const tasks=getProjectTasks(pid).filter(t=>t.completedAt);
  const counts=days.map(d=>tasks.filter(t=>t.completedAt&&t.completedAt.startsWith(d)).length);
  const max=Math.max(...counts,1);
  const total=counts.reduce((a,b)=>a+b,0);
  const bars=counts.map((c,i)=>`<div class="vel-bar" style="height:${Math.max(Math.round(c/max*100),10)}%;background:${c>0?'var(--accent)':'var(--surface3)'};opacity:${c>0?0.7+c/max*0.3:1}" title="${days[i]}: ${c} task${c!==1?'s':''} completed"></div>`).join('');
  const dayLabels=days.map(d=>`<div class="vel-day-label">${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'}).toUpperCase().slice(0,1)}</div>`).join('');
  if(bare) return `<div class="vel-bars" style="flex:1">${bars}</div><div class="vel-day-labels">${dayLabels}</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:10px">${total} task${total!==1?'s':''} completed this week</div>`;
  return `<div class="vel-section"><div class="vel-label">7-DAY VELOCITY · ${total} DONE</div><div class="vel-bars">${bars}</div></div>`;
}

// ── PER-PROJECT JARVIS CONTEXT ──
function copyProjectContext(pid){
  const p=getProjectById(pid); if(!p) return;
  const tasks=getProjectTasks(pid);
  const done=tasks.filter(t=>t.status==='done').length;
  const blocked=tasks.filter(t=>t.blocked&&t.status!=='done');
  let ctx=`## Chronicle — ${p.name}\n**Date:** ${todayISO()} | **Progress:** ${calcProgress(pid)}% (${done}/${tasks.length} tasks)\n${p.deadline?`**Deadline:** ${p.deadline}\n`:''}\n`;
  (p.phases||[]).forEach(ph=>{
    const pt=ph.taskIds.map(id=>getTaskById(id)).filter(Boolean);
    ctx+=`### ${ph.name} (${pt.filter(t=>t.status==='done').length}/${pt.length})\n`;
    pt.forEach(t=>{ ctx+=`- [${t.status.toUpperCase()}${t.blocked?' BLOCKED':''}] ${t.title}${t.deadline?' (due '+t.deadline+')':''}\n`; });
  });
  if(blocked.length){ ctx+=`\n### Blocked\n`; blocked.forEach(t=>ctx+=`- ${t.title}: ${t.notes||'no details'}\n`); }
  ctx+=`\n---\n[Your question here]`;
  navigator.clipboard.writeText(ctx).then(()=>showToast(`${p.name} context copied ✓`,'success')).catch(()=>showToast('Copy failed','error'));
}

function sendToJarvis(pid){
  const input=document.getElementById('jarvis-input-'+pid);
  const msg=input?.value.trim();
  if(!msg){ showToast('Type a message first','error'); return; }
  const p=getProjectById(pid); if(!p) return;
  const tasks=getProjectTasks(pid);
  const done=tasks.filter(t=>t.status==='done').length;
  const blocked=tasks.filter(t=>t.blocked&&t.status!=='done');
  const todo=tasks.filter(t=>t.status==='todo'||t.status==='doing');
  let ctx=`You are Jarvis, my personal project assistant for Chronicle.\n\n`;
  ctx+=`## Project: ${p.name}\n`;
  ctx+=`Date: ${todayISO()} | Progress: ${calcProgress(pid)}% (${done}/${tasks.length} tasks done)`;
  if(p.deadline) ctx+=` | Deadline: ${p.deadline}`;
  ctx+=`\n\n`;
  (p.phases||[]).forEach(ph=>{
    const pt=ph.taskIds.map(id=>getTaskById(id)).filter(Boolean);
    const pDone=pt.filter(t=>t.status==='done').length;
    ctx+=`### ${ph.name} — ${pDone}/${pt.length} done\n`;
    pt.forEach(t=>{
      const tags=[t.status.toUpperCase()];
      if(t.blocked) tags.push('BLOCKED');
      if(t.priority) tags.push(t.priority.toUpperCase());
      ctx+=`- [${tags.join(' | ')}] ${t.title}`;
      if(t.deadline) ctx+=` (due ${t.deadline})`;
      if(t.notes) ctx+=`\n  Notes: ${t.notes}`;
      ctx+=`\n`;
    });
    ctx+=`\n`;
  });
  if(blocked.length){
    ctx+=`### ⚠ Blocked Items\n`;
    blocked.forEach(t=>ctx+=`- ${t.title}: ${t.notes||'no details'}\n`);
    ctx+=`\n`;
  }
  ctx+=`---\n**My question:** ${msg}`;
  navigator.clipboard.writeText(ctx).then(()=>{
    showToast('Copied — paste into Jarvis (Claude.ai) ✓','success');
    input.value='';
  }).catch(()=>showToast('Copy failed — try again','error'));
}

// ── UTILS ──
function modalOutsideClick(e,id){ if(e.target===document.getElementById(id)||e.target.classList.contains('modal-backdrop')) document.getElementById(id).classList.remove('open'); }
function getProjectById(id){ return APP.data?.projects?.[id]; }
function getTaskById(id){ return APP.data?.tasks?.[id]; }
function getProjectTasks(pid){ return Object.values(APP.data?.tasks||{}).filter(t=>t.project===pid); }
function calcProgress(pid){ const t=getProjectTasks(pid); if(!t.length) return 0; return Math.round(t.filter(x=>x.status==='done').length/t.length*100); }
function todayISO(){ return new Date().toISOString().split('T')[0]; }
function daysUntil(d){ const dt=new Date(d+'T00:00:00'), td=new Date(); td.setHours(0,0,0,0); return Math.ceil((dt-td)/86400000); }
function deadlineClass(d){ const n=daysUntil(d); return n<0?'overdue':n<=3?'urgent':n<=7?'warn':'ok'; }
function formatDate(iso){ return iso?new Date(iso+'T00:00:00').toLocaleDateString('en',{month:'short',day:'numeric'}):''; }
function formatDateShort(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'}).toUpperCase(); }
function formatDateLong(iso){ return new Date(iso).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function timeAgo(iso){ const d=(Date.now()-new Date(iso))/1000; if(d<60) return 'just now'; if(d<3600) return Math.floor(d/60)+'m ago'; if(d<86400) return Math.floor(d/3600)+'h ago'; return Math.floor(d/86400)+'d ago'; }
function escHtml(s=''){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg,type=''){
  const t=document.getElementById('toast'); t.textContent=msg; t.className='show '+(type||'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',3000);
}
function getDefaultData(){ return {meta:{lastUpdated:new Date().toISOString(),version:'3.0'},focus:{date:todayISO(),taskIds:[],note:''},projects:{},tasks:{},events:{}}; }

  if(window.innerWidth>768) document.body.classList.add('sb-open');
  await loadData();
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape') return;
    if(document.getElementById('task-drawer').classList.contains('open')) closeDrawer();
    else if(document.getElementById('add-task-modal').classList.contains('open')) closeAddTaskModal();
    else if(document.getElementById('focus-modal').classList.contains('open')) closeFocusModal();
    else if(document.getElementById('settings-modal').classList.contains('open')) closeSettingsModal();
  });
  setInterval(()=>loadData(),5*60*1000);
}

window.addEventListener('DOMContentLoaded',()=>{
  if(checkAuth()){
    document.getElementById('auth-gate').style.display='none';
    document.getElementById('loading').style.display='flex';
    initApp();
  } else {
    setTimeout(()=>document.getElementById('auth-input').focus(),100);
    document.getElementById('auth-input').addEventListener('keydown',e=>{ if(e.key==='Enter') submitAuth(); });
  }
});
</script>
</body>
</html>
